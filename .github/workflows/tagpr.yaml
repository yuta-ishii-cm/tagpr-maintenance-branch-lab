name: TAGPR

# tagpr は機能リリース（main）専用。リリースPRのブランチ名が tagpr-from-<最新タグ> で固定のため、
# 保守ブランチでも動かすと main と同じブランチを奪い合う。修正リリースは hotfix-release.yaml で行う。
on:
  push:
    branches:
      - main

concurrency:
  group: tagpr
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  tagpr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # tagpr は全ブランチの最新タグを現在バージョンとみなし、versionFile の値を優先する。
      # 最新タグが main に未反映、または versionFile が最新タグとずれたまま動かすとバージョンがずれるため止める。
      - name: Guard
        id: guard
        env:
          GUARD_DISABLED: ${{ vars.GUARD_DISABLED }}
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -z "$latest" ]; then
            echo "::notice::タグが無いためスキップ"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IFS=',' read -ra version_files <<< "$(git config -f .tagpr tagpr.versionFile)"
          current=$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' "${version_files[0]}" | head -n 1)
          if [ "$GUARD_DISABLED" = "true" ]; then
            echo "::warning::GUARD_DISABLED=true のためガードを無効化"
          elif ! git merge-base --is-ancestor "$latest" HEAD; then
            echo "::warning::最新タグ ${latest} が main に未反映（同期PR待ち）のためスキップ"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          # リリースPRのマージ直後は versionFile が最新タグより新しいのが正常。古いときだけ止める
          elif [ "$current" != "$latest" ] && [ "$(printf '%s\n%s\n' "$current" "$latest" | sort -V | tail -n 1)" = "$latest" ]; then
            echo "::error::versionFile（${current}）が最新タグ ${latest} より古いためスキップ。versionFile を ${latest} に直してください"
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: Songmu/tagpr@242e22916eb775d6e359959fe3ba5c497de4a01a # v1.20.2
        id: tagpr
        if: steps.guard.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 機能リリースは minor を上げ、保守ブランチの修正リリース（patch）と番号帯を分ける
      - name: Mark release PR as minor
        id: minor
        if: steps.tagpr.outputs.pull_request != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.tagpr.outputs.pull_request }}
        run: |
          if jq -e '.labels[]? | select(.name == "tagpr:minor")' <<< "$PR_JSON" > /dev/null; then
            echo "relabeled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh label create 'tagpr:minor' --color '0e8a16' --force
          gh pr edit "$(jq -r '.number' <<< "$PR_JSON")" --add-label 'tagpr:minor'
          echo "relabeled=true" >> "$GITHUB_OUTPUT"

      # ラベルは次回の実行から反映されるため、付けた直後にもう一度 tagpr を動かしてリリースPRを minor にする
      - name: Restore release branch
        if: steps.minor.outputs.relabeled == 'true'
        run: git checkout -f main

      - uses: Songmu/tagpr@242e22916eb775d6e359959fe3ba5c497de4a01a # v1.20.2
        if: steps.minor.outputs.relabeled == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 修正リリースで最新タグが変わると、リリースPRのブランチ名（tagpr-from-<最新タグ>）も変わって
      # 新しいリリースPRが作られる。古いほうが残るため閉じる
      - name: Close stale release PRs
        if: steps.tagpr.outputs.pull_request != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.tagpr.outputs.pull_request }}
        run: |
          current=$(jq -r '.number' <<< "$PR_JSON")
          gh pr list --state open --label tagpr --json number --jq ".[] | select(.number != ${current}) | .number" |
            while read -r number; do
              gh pr close "$number" --delete-branch --comment "#${current} に置き換えるため、クローズします。"
            done

  # main の更新（機能リリースや別の同期PRのマージ）で、main への同期PRが versionFile・CHANGELOG.md で
  # コンフリクトしたら直す
  refresh-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Refresh sync pull requests into main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          .github/scripts/refresh-sync-prs.sh main

  # 機能リリース（vX.Y.0）: 保守ブランチ release/vX.Y を作り、旧保守ブランチ向けの修正候補PRを付け替える
  open-maintenance-branch:
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.tagpr.outputs.tag }}
      WAIT_ATTEMPTS: 30
      WAIT_SECONDS: 2
    steps:
      - name: Create maintenance branch and retarget pull requests
        run: |
          branch="release/${TAG%.*}"
          sha=$(gh api "repos/${GH_REPO}/commits/${TAG}" --jq .sha)
          gh api "repos/${GH_REPO}/git/refs" -f ref="refs/heads/${branch}" -f sha="${sha}"

          gh pr list --state open --json number,baseRefName,headRefName,headRefOid \
            --jq ".[] | select(.baseRefName | startswith(\"release/\")) | select(.baseRefName != \"${branch}\") | \"\(.number) \(.headRefName) \(.headRefOid)\"" |
            while read -r number head head_sha; do
              gh pr edit "$number" --base "$branch"
              if ! gh api -X PUT "repos/${GH_REPO}/pulls/${number}/update-branch" -f expected_head_sha="$head_sha"; then
                gh pr comment "$number" --body "${branch} を取り込めませんでした（コンフリクト）。手で解消してください。"
                continue
              fi
              # update-branch は非同期のため、ブランチの先頭が変わってから CI を起動する。
              # GITHUB_TOKEN による push では CI の on: push が起動しない
              attempts=0
              until [ "$(gh api "repos/${GH_REPO}/pulls/${number}" --jq .head.sha)" != "$head_sha" ]; do
                attempts=$((attempts + 1))
                if [ "$attempts" -ge "$WAIT_ATTEMPTS" ]; then
                  echo "::warning::#${number} のブランチ更新を確認できなかったため、CI を起動していません"
                  continue 2
                fi
                sleep "$WAIT_SECONDS"
              done
              gh workflow run ci.yaml --ref "$head"
            done
