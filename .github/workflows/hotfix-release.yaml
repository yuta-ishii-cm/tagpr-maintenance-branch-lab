name: HOTFIX_RELEASE
run-name: HOTFIX_RELEASE (${{ inputs.branch }})

# 保守ブランチ release/vX.Y にマージ済みの修正をリリースする。
# 次のバージョンはその保守ブランチの最新タグ（vX.Y.*）の patch を上げて決める。
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Maintenance branch (e.g. release/v1.1)'
        required: true
        type: string

concurrency:
  group: hotfix-release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ inputs.branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Decide version
        id: version
        run: |
          if ! [[ "$BRANCH" =~ ^release/(v[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::保守ブランチ（release/vX.Y）を指定してください: ${BRANCH}"
            exit 1
          fi
          line="${BASH_REMATCH[1]}"
          current=$(git tag --list "${line}.*" --sort=-v:refname | head -n 1)
          if [ -z "$current" ]; then
            echo "::error::${line}.* のタグがありません"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$current" HEAD; then
            echo "::error::${current} が ${BRANCH} に含まれていません"
            exit 1
          fi
          if [ "$(git rev-parse "${current}^{commit}")" = "$(git rev-parse HEAD)" ]; then
            echo "::error::${current} 以降にリリースする変更がありません"
            exit 1
          fi
          next="${line}.$(( ${current##*.} + 1 ))"
          echo "line=${line}" >> "$GITHUB_OUTPUT"
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "next=${next}" >> "$GITHUB_OUTPUT"
          echo "${current} -> ${next}"

      - name: Update versionFile and CHANGELOG
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          IFS=',' read -ra files <<< "$(git config -f .tagpr tagpr.versionFile)"
          for f in "${files[@]}"; do
            sed -i "s/${CURRENT}/${NEXT}/g" "$f"
          done

          notes=$(gh api "repos/${GH_REPO}/releases/generate-notes" \
            -f tag_name="$NEXT" -f target_commitish="$BRANCH" -f previous_tag_name="$CURRENT" \
            --jq '.body' | grep '^\* ' | sed 's/^\* /- /' || true)
          header="## [${NEXT}](https://github.com/${GH_REPO}/compare/${CURRENT}...${NEXT}) - $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          { head -n 1 CHANGELOG.md; printf '\n%s\n%s\n' "$header" "$notes"; tail -n +2 CHANGELOG.md; } > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md "${files[@]}"
          git commit -m "[hotfix-release] prepare for ${NEXT}"
          git tag "$NEXT"
          git push origin "HEAD:${BRANCH}" "$NEXT"

      - name: Create GitHub Release
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          gh release create "$NEXT" --verify-tag --title "$NEXT" \
            --generate-notes --notes-start-tag "$CURRENT"

      # 機能リリースのタグ作成から pro へのデプロイまでの間に旧保守ブランチで修正を出すと、
      # 新しい保守ブランチにも反映が要るため、main だけでなく自分より新しい保守ブランチにも同期PRを作る
      - name: Open sync pull requests
        env:
          LINE: ${{ steps.version.outputs.line }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          newer=$(git for-each-ref --format='%(refname:lstrip=3)' 'refs/remotes/origin/release/v*' |
            sort -V | awk -v cur="$BRANCH" 'found { print } $0 == cur { found = 1 }')

          IFS=',' read -ra version_files <<< "$(git config -f .tagpr tagpr.versionFile)"
          # CHANGELOG.md から今回のバージョンの節（次の「## [」の手前まで）を取り出す
          section=$(git show "${NEXT}:CHANGELOG.md" |
            awk -v head="## [${NEXT}]" 'index($0, head) == 1 { p = 1 } p && /^## \[/ && index($0, head) != 1 { exit } p { print }')

          for base in $newer main; do
            sync="sync/${NEXT}-to-${base//\//-}"
            note=""

            # 同期先が機能リリース済みだったり、過去に複数の保守ブランチへ同期したりしていると、
            # versionFile・CHANGELOG がぶつかる。それだけなら同期ブランチ側で解消する。
            # versionFile は同期先と今回のうち新しいバージョン、CHANGELOG は同期先の内容の先頭に今回の節を差し込む
            git switch -q --detach "origin/${base}"
            if git merge -q --no-ff --no-edit "$NEXT"; then
              git switch -q --detach "$NEXT"
            else
              conflicted=$(git diff --name-only --diff-filter=U)
              others=$(grep -vxF -e CHANGELOG.md "${version_files[@]/#/-e}" <<< "$conflicted" || true)
              if [ -z "$others" ]; then
                base_version=$(git show "origin/${base}:${version_files[0]}" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n 1)
                kept=$(printf '%s\n%s\n' "$base_version" "$NEXT" | sort -V | tail -n 1)
                if [ "$kept" = "$NEXT" ]; then
                  git checkout --theirs -- "${version_files[@]}"
                else
                  git checkout --ours -- "${version_files[@]}"
                fi
                git show "origin/${base}:CHANGELOG.md" > CHANGELOG.ours
                { head -n 1 CHANGELOG.ours; printf '\n%s\n\n' "$section"; tail -n +3 CHANGELOG.ours; } > CHANGELOG.md
                rm CHANGELOG.ours
                git add CHANGELOG.md "${version_files[@]}"
                git commit -q --no-edit
                note="versionFile・CHANGELOG.md のコンフリクトは自動で解消済みです（versionFile は ${kept}）。"
              else
                git merge --abort
                git switch -q --detach "$NEXT"
                note="次のファイルがコンフリクトしています。手で解消してください: $(tr '\n' ' ' <<< "$others")"
              fi
            fi
            git push origin "HEAD:refs/heads/${sync}"

            # 同じ保守ブランチからの古い同期PRは、新しい同期PRに内容が含まれるため閉じる
            gh pr list --state open --base "$base" --json number,headRefName \
              --jq ".[] | select(.headRefName | startswith(\"sync/${LINE}.\")) | .number" |
              while read -r number; do
                gh pr close "$number" --delete-branch --comment "${sync} の同期PRに置き換えるため、クローズします。"
              done

            gh pr create --base "$base" --head "$sync" \
              --title "sync: ${NEXT} を ${base} に反映する" \
              --body "保守ブランチ ${BRANCH} でリリースした ${NEXT} を ${base} に取り込みます。${note}"
          done

      - name: Update fix candidates
        env:
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          gh pr list --state open --base "$BRANCH" --json number --jq '.[].number' |
            while read -r number; do
              gh api -X PUT "repos/${GH_REPO}/pulls/${number}/update-branch" ||
                gh pr comment "$number" --body "${NEXT} を取り込めませんでした（コンフリクト）。手で解消してください。"
            done
