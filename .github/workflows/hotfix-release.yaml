name: HOTFIX_RELEASE
run-name: HOTFIX_RELEASE (${{ inputs.branch }})

# 保守ブランチ release/vX.Y にマージ済みの修正をリリースする。
# 次のバージョンはその保守ブランチの最新タグ（vX.Y.*）の patch を上げて決める。
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Maintenance branch (e.g. release/v1.1)'
        required: true
        type: string

concurrency:
  group: hotfix-release
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ inputs.branch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      # 同期のスクリプトは、このワークフローと同じ ref（main）のものを使う。
      # 保守ブランチにあるファイルは、そのブランチを作った時点のままのため
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          path: .tools
          sparse-checkout: .github/scripts

      - name: Decide version
        id: version
        run: |
          if ! [[ "$BRANCH" =~ ^release/(v[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::保守ブランチ（release/vX.Y）を指定してください: ${BRANCH}"
            exit 1
          fi
          line="${BASH_REMATCH[1]}"
          current=$(git tag --list "${line}.*" --sort=-v:refname | head -n 1)
          if [ -z "$current" ]; then
            echo "::error::${line}.* のタグがありません"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$current" HEAD; then
            echo "::error::${current} が ${BRANCH} に含まれていません"
            exit 1
          fi
          if [ "$(git rev-parse "${current}^{commit}")" = "$(git rev-parse HEAD)" ]; then
            echo "::error::${current} 以降にリリースする変更がありません"
            exit 1
          fi
          next="${line}.$(( ${current##*.} + 1 ))"
          echo "line=${line}" >> "$GITHUB_OUTPUT"
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "next=${next}" >> "$GITHUB_OUTPUT"
          echo "${current} -> ${next}"

      - name: Update versionFile and CHANGELOG
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          IFS=',' read -ra files <<< "$(git config -f .tagpr tagpr.versionFile)"
          for f in "${files[@]}"; do
            sed -i "s/${CURRENT}/${NEXT}/g" "$f"
          done

          notes=$(gh api "repos/${GH_REPO}/releases/generate-notes" \
            -f tag_name="$NEXT" -f target_commitish="$BRANCH" -f previous_tag_name="$CURRENT" \
            --jq '.body' | grep '^\* ' | sed 's/^\* /- /' || true)
          header="## [${NEXT}](https://github.com/${GH_REPO}/compare/${CURRENT}...${NEXT}) - $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          { head -n 1 CHANGELOG.md; printf '\n%s\n%s\n' "$header" "$notes"; tail -n +2 CHANGELOG.md; } > CHANGELOG.tmp
          mv CHANGELOG.tmp CHANGELOG.md

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md "${files[@]}"
          git commit -m "[hotfix-release] prepare for ${NEXT}"
          git tag "$NEXT"
          git push origin "HEAD:${BRANCH}" "$NEXT"

      - name: Create GitHub Release
        env:
          CURRENT: ${{ steps.version.outputs.current }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          gh release create "$NEXT" --verify-tag --title "$NEXT" \
            --generate-notes --notes-start-tag "$CURRENT"

      # 機能リリースのタグ作成から pro へのデプロイまでの間に旧保守ブランチで修正を出すと、
      # 新しい保守ブランチにも反映が要るため、main だけでなく自分より新しい保守ブランチにも同期PRを作る
      - name: Open sync pull requests
        env:
          LINE: ${{ steps.version.outputs.line }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          newer=$(git for-each-ref --format='%(refname:lstrip=3)' 'refs/remotes/origin/release/v*' |
            sort -V | awk -v cur="$BRANCH" 'found { print } $0 == cur { found = 1 }')

          for base in $newer main; do
            sync="sync/${NEXT}-to-${base//\//-}"
            note=""

            # 同期先が機能リリース済みだったり、過去に複数の保守ブランチへ同期したりしていると、
            # versionFile・CHANGELOG.md がぶつかる。それだけなら同期ブランチ側で解消する（resolve-sync-conflicts.sh）
            git switch -q --detach "origin/${base}"
            if git merge -q --no-ff --no-edit "$NEXT"; then
              git switch -q --detach "$NEXT"
            elif result=$(.tools/.github/scripts/resolve-sync-conflicts.sh "origin/${base}" "$NEXT"); then
              git commit -q --no-edit
              note="versionFile・CHANGELOG.md のコンフリクトは自動で解消済みです（versionFile は ${result}）。"
            else
              git merge --abort
              git switch -q --detach "$NEXT"
              note="次のファイルがコンフリクトしています。手で解消してください: $(tr '\n' ' ' <<< "$result")"
            fi
            git push origin "HEAD:refs/heads/${sync}"
            # GITHUB_TOKEN による push では CI の on: push が起動しないため、ここで起動する
            gh workflow run ci.yaml --ref "$sync"

            # 同じ保守ブランチからの古い同期PRは、新しい同期PRに内容が含まれるため閉じる
            gh pr list --state open --base "$base" --json number,headRefName \
              --jq ".[] | select(.headRefName | startswith(\"sync/${LINE}.\")) | .number" |
              while read -r number; do
                gh pr close "$number" --delete-branch --comment "${sync} の同期PRに置き換えるため、クローズします。"
              done

            gh pr create --base "$base" --head "$sync" \
              --title "sync: ${NEXT} を ${base} に反映する" \
              --body "保守ブランチ ${BRANCH} でリリースした ${NEXT} を ${base} に取り込みます。${note}"
          done

      # 古い系統から、今回リリースした保守ブランチに向けて開いている同期PRは、
      # 今回の versionFile・CHANGELOG.md の更新でコンフリクトするため直す
      - name: Refresh sync pull requests into this branch
        run: .tools/.github/scripts/refresh-sync-prs.sh "$BRANCH"

      - name: Update fix candidates
        env:
          NEXT: ${{ steps.version.outputs.next }}
          WAIT_ATTEMPTS: 30
          WAIT_SECONDS: 2
        run: |
          # 同期PR（sync/）は、前のステップで直しているため対象外
          gh pr list --state open --base "$BRANCH" --json number,headRefName,headRefOid \
            --jq '.[] | select(.headRefName | startswith("sync/") | not) | "\(.number) \(.headRefName) \(.headRefOid)"' |
            while read -r number head sha; do
              if ! gh api -X PUT "repos/${GH_REPO}/pulls/${number}/update-branch" -f expected_head_sha="$sha"; then
                gh pr comment "$number" --body "${NEXT} を取り込めませんでした（コンフリクト）。手で解消してください。"
                continue
              fi
              # update-branch は非同期のため、ブランチの先頭が変わってから CI を起動する
              attempts=0
              until [ "$(gh api "repos/${GH_REPO}/pulls/${number}" --jq .head.sha)" != "$sha" ]; do
                attempts=$((attempts + 1))
                if [ "$attempts" -ge "$WAIT_ATTEMPTS" ]; then
                  echo "::warning::#${number} のブランチ更新を確認できなかったため、CI を起動していません"
                  continue 2
                fi
                sleep "$WAIT_SECONDS"
              done
              gh workflow run ci.yaml --ref "$head"
            done
